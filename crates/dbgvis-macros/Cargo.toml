[package]
name = "dbgvis-macros"
version = "0.2.0"
edition = "2024"
description = "Derive and attribute macros for dbgvis (Visualize, register, register_type!)."
keywords = ["dbgvis", "debugger", "derive", "macros"]
categories = ["development-tools::debugging"]
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.119", features = ["full", "visit-mut"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
toml = "1.1.2"
