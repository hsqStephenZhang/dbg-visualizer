[package]
name = "dbg-visualizer"
version = "0.1.0"
edition = "2024"
publish = false  # the workspace root holds the examples/tests, not a published crate

[workspace]
members = ["crates/dbgvis-runtime", "crates/dbgvis", "crates/dbgvis-macros", "crates/cargo-dbgvis", "xtask"]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hsqStephenZhang/dbg-visualizer"

[dependencies]
bytes = "1.11.0"
indexmap = "2.12.1"
hashbrown = { version = "0.17.1", default-features = false }
dbgvis = { path = "crates/dbgvis", features = ["derive"] }

[profile.release]
debug = 2

[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1

[profile.abort]
inherits = "dev"
panic = "abort"
