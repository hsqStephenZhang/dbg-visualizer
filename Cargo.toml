[package]
name = "dbg-visualizer"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/visualizer-runtime", "crates/dbgvis", "crates/dbgvis-macros"]
resolver = "2"

[dependencies]
bytes = "1.11.0"
indexmap = "2.12.1"
hashbrown = { version = "0.17.1", default-features = false }
dbgvis = { path = "crates/dbgvis", features = ["derive"] }

[profile.release]
debug = 2

[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1

[profile.abort]
inherits = "dev"
panic = "abort"
